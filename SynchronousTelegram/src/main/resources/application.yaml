spring:
  application:
    name: SynchronousTelegram

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5454/Synchronous}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

server:
  port: 0

token: ${TELEGRAM_TOKEN}
dMTopic: Discord
dCTopic: DiscordCommand
groupId: synchronous
tMTopic: Telegram
tCTopic: TelegramCommand
