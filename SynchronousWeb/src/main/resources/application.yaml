spring:
  application:
    name: SynchronousWeb

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5454/Synchronous}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${CHAT_KAFKA_GROUP_ID:web-chat}
      auto-offset-reset: ${CHAT_KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8080}

chat:
  auth:
    token: ${CHAT_ACCESS_TOKEN:}
  media:
    directory: ${CHAT_MEDIA_DIR:./data/chat-media}
    max-image-size: ${CHAT_MAX_IMAGE_SIZE:10485760}
  kafka:
    telegram-topic: ${CHAT_TELEGRAM_TOPIC:Telegram}
    discord-topic: ${CHAT_DISCORD_TOPIC:Discord}
    group-id: ${CHAT_KAFKA_GROUP_ID:web-chat}
