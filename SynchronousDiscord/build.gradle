plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.2.4'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.larffxx'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    maven { url 'https://m2.dv8tion.net/releases' }
    maven { url "https://jitpack.io" }
    maven { url "https://maven.lavalink.dev/releases" }
    maven { url "https://maven.topi.wtf/releases" }
    maven { url "https://maven.lavalink.dev/snapshots" }
    mavenCentral()
}

ext {
    set('springCloudVersion', "2023.0.1")
}

dependencies {
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation("net.dv8tion:JDA:6.3.0")
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.apache.kafka:kafka-streams'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'dev.arbjerg:lavaplayer:2.2.6'
    implementation("dev.lavalink.youtube:common:1.16.0")
    implementation "com.github.topi314.lavasrc:lavasrc:4.8.1"
    implementation "com.github.topi314.lavasrc:lavasrc-protocol:4.8.1"
    implementation "io.netty:netty-buffer:4.1.130.Final"
    implementation "moe.kyokobot.libdave:adapter-jda:0.1.2"
    implementation("moe.kyokobot.libdave:impl-jni:0.1.2")
    runtimeOnly "moe.kyokobot.libdave:natives-darwin:0.1.2"
    implementation("com.google.guava:guava:31.0.1-jre")
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}


tasks.named('test') {
    useJUnitPlatform()
}
