spring:
  application:
    name: SynchronousDiscord

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5454/Synchronous}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

server:
  port: 0

token: ${DISCORD_TOKEN}

dMTopic: Discord
dCTopic: DiscordCommand
tMTopic: Telegram
tCTopic: TelegramCommand
groupId: synchronous

coolness:
  mode: ${COOLNESS_MODE:opencode}
  opencodeBin: ${COOLNESS_OPENCODE_BIN:opencode}
  opencodeModel: ${COOLNESS_OPENCODE_MODEL:opencode/big-pickle}
  apiUrl: ${COOLNESS_API_URL:https://opencode.ai/zen/v1}
  apiModel: ${COOLNESS_API_MODEL:big-pickle}
  apiKey: ${COOLNESS_API_KEY:${OPENCODE_ZEN_API_KEY:}}
  apiTimeoutSeconds: ${COOLNESS_API_TIMEOUT_SECONDS:60}
